site_name: 我的技术文档
site_description: 基于 MkDocs Material 构建的高级文档示例
theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至暗黑模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至亮色模式
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
nav:
  - 首页: index.md
  - 关于: about.md
  - 指南: guide.md
  - API: api.md